<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Leads{% endblock %} · Nonprofit Leadgen</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">N</span><span>Nonprofit Leadgen</span></a>
      <span class="header-label">Local lead workspace</span>
    </div>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="wrap site-footer">Source-reported contact details require verification before use.</footer>
</body>
</html>
